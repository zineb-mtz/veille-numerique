# Liste des sources du robot de veille (format TOML).
# Ces sources ne sont pas secrètes : ce fichier sert directement au robot.
# Pour une liste privée, copier ce fichier en config/sources.toml (jamais publié).
#
# axe = "IA" (IA et innovation), "PUBLIC" (Numérique public) ou "CONFIANCE" (Confiance et cadre)

[reglages]
fraicheur_jours = 7        # une info plus ancienne est ignorée
max_par_source = 20        # au plus N infos par source et par passage
gmail_libelle = "Veille numérique"
gmail_jours = 3            # profondeur de lecture du libellé Gmail

# ---------------------------------------------------------------- flux RSS / Atom
# Vérifiés le 23/11/2026 (flux lu ou page officielle), sauf mention « à tester ».

[[flux]]
nom = "Mistral AI"
url = "https://mistral.ai/news/rss"
axe = "IA"

[[flux]]
nom = "OpenAI"                       # à tester ; ordre non chronologique signalé (le robot trie)
url = "https://openai.com/news/rss.xml"
axe = "IA"
maximum = 5                          # beaucoup de témoignages clients : on garde les 5 plus récents

[[flux]]
nom = "Hugging Face"                 # à tester ; adresse des articles dans <guid> (géré)
url = "https://huggingface.co/blog/feed.xml"
axe = "IA"

[[flux]]
nom = "Google DeepMind"              # à tester
url = "https://deepmind.google/blog/rss.xml"
axe = "IA"

[[flux]]
nom = "Vie publique · rapports"
url = "https://www.vie-publique.fr/rapports-feeds.xml"
axe = "PUBLIC"

[[flux]]
nom = "Vie publique · consultations"
url = "https://www.vie-publique.fr/debats-consultations-feeds.xml"
axe = "PUBLIC"

# CERT-FR retiré le 24/11/2026 : alertes techniques quotidiennes, hors besoin.
# Les grandes fuites de données touchant le secteur public arrivent par les lettres
# (Acteurs publics, Localtis, Maire-info) et, une fois inscrite, la lettre de la CNIL.


[[flux]]
nom = "Observatoire Data Publica"    # vérifié le 25/11/2026 ; baromètre annuel data et IA des collectivités
url = "https://observatoire.data-publica.eu/feed/"
axe = "PUBLIC"

# Civiteo : pas de flux RSS (le site renvoie une page web) ; à suivre par lettre d'info ou « Tes liens ».

# ---------------------------------------------------------------- chaînes YouTube
# chaine_id = l'identifiant de la chaîne (commence par UC, 24 caractères).
# sans_shorts = true : seulement les vidéos longues.
# Chaînes vérifiées le 24/11/2026 (flux lu depuis GitHub). Forme d'une entrée :
#
# [[youtube]]
# nom = "Nom de la chaîne"
# chaine_id = "UCxxxxxxxxxxxxxxxxxxxxxx"
# axe = "PUBLIC"
# sans_shorts = true

