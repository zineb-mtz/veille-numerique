[project]
name = "veille-numerique"
version = "0.1.0"
description = "Robot de veille sur l'IA et le numérique public : collecte gratuite vers Notion"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F : erreurs de base ; I : ordre des imports ; B : pièges courants ; S : sécurité (bandit) ;
# UP : syntaxe moderne ; SIM : simplifications.
select = ["E", "F", "I", "B", "S", "UP", "SIM"]
ignore = ["S101"]   # assert autorisé (tests)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]   # données de test (XML, e-mails) sur une ligne

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["veille"]

[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
